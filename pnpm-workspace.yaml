packages:
  - examples/**
  - docs
  - client

catalog:
  nuxt: ^4.5.2
  vite-plugin-inspect: ^12.0.2

catalogs:
  vite-plus:
    'vite': npm:@voidzero-dev/vite-plus-core@1.1.0
    'vite-plus': 1.1.0
    'vitest': 5.0.3
    '@vitest/ui': 5.0.3

ignoreWorkspaceRootCheck: true

overrides:
  vite@*: catalog:vite-plus
  vitest@*: catalog:vite-plus

shamefullyHoist: true
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  sharp: true
  vue-demi: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
